<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="surmioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b2b"/>
      <stop offset="50%" stop-color="#0a0618"/>
      <stop offset="100%" stop-color="#05030d"/>
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="surmioRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soundwave Gradient -->
    <linearGradient id="surmioWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="surmioAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Glow Filter -->
    <filter id="surmioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#surmioBg)" stroke="url(#surmioRim)" stroke-width="3.5"/>

  <!-- Radial Acoustic Aura -->
  <circle cx="256" cy="256" r="190" fill="url(#surmioAura)"/>

  <!-- Subtle Vinyl Groove Ripples -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#a855f7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#ec4899" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- S-Wave Equalizer Monogram -->
  <g filter="url(#surmioGlow)">
    <!-- Harmonic Equalizer Pulse Bars (Flanking) -->
    <rect x="136" y="196" width="18" height="64" rx="9" fill="#c084fc" opacity="0.6"/>
    <rect x="166" y="160" width="18" height="114" rx="9" fill="#c084fc" opacity="0.9"/>
    
    <!-- Central Flowing S-Wave Ribbon -->
    <path d="M 296 142 
             C 336 142, 362 166, 362 202
             C 362 242, 320 258, 256 270
             C 192 282, 150 298, 150 338
             C 150 374, 177 398, 216 398
             C 246 398, 276 384, 304 362
             L 316 380
             C 284 406, 250 422, 216 422
             C 162 422, 126 388, 126 338
             C 126 290, 172 272, 236 260
             C 300 248, 338 232, 338 202
             C 338 176, 318 162, 296 162
             C 268 162, 240 176, 212 198
             L 200 180
             C 232 154, 264 142, 296 142 Z" 
          fill="url(#surmioWave)"/>

    <!-- High-Fidelity Center Amplitude Bars -->
    <rect x="238" y="190" width="14" height="42" rx="7" fill="#ffffff" opacity="0.95"/>
    <rect x="260" y="278" width="14" height="46" rx="7" fill="#ffffff" opacity="0.95"/>

    <!-- Harmonic Equalizer Pulse Bars (Right) -->
    <rect x="328" y="266" width="18" height="114" rx="9" fill="#06b6d4" opacity="0.9"/>
    <rect x="358" y="286" width="18" height="64" rx="9" fill="#06b6d4" opacity="0.6"/>
  </g>

  <!-- Musical Energy Spark Nodes -->
  <circle cx="362" cy="148" r="6" fill="#f43f5e"/>
  <circle cx="150" cy="392" r="5" fill="#38bdf8"/>
</svg>
